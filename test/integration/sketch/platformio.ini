; Build/upload the LoopbackTestRunner sketch to an Arduino-compatible board.
;
; Layout: PlatformIO wants src/*.cpp, but Arduino sketches live as a .ino in a
; subfolder. We point src_dir at the sketch folder so PIO picks it up directly.

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
; CmdMessenger library lives in the repo root (Arduino 1.5 layout, src/).
lib_extra_dirs = ../../../
monitor_speed = 115200
upload_port = COM11

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ../../../
monitor_speed = 115200
upload_port = COM12
upload_speed = 921600

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_extra_dirs = ../../../
monitor_speed = 115200
upload_speed = 921600

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_extra_dirs = ../../../
monitor_speed = 115200
upload_speed = 921600

[env:rp2040]
platform = raspberrypi
board = pico
framework = arduino
lib_extra_dirs = ../../../
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_extra_dirs = ../../../
monitor_speed = 115200

[env:teensy30]
platform = teensy
board = teensy30
framework = arduino
lib_extra_dirs = ../../../
monitor_speed = 115200
upload_port = COM16
